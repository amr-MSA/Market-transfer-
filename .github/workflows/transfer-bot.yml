name: Transfer Confirmation Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transfer-confirmation-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize latest state
        run: |
          # A queued manual run can begin from an older checkout after a
          # scheduled run has already saved new JSON state. Refresh before
          # the bot reads or writes state, while the concurrency lock is held.
          git pull --ff-only origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Defer while fast monitor is healthy
        id: fast_monitor
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/fast_monitor.json")
          fresh = False
          try:
              updated = json.loads(path.read_text(encoding="utf-8")).get("updated_at")
              if updated:
                  then = datetime.fromisoformat(updated.replace("Z", "+00:00"))
                  fresh = (datetime.now(timezone.utc) - then).total_seconds() < 360
          except (OSError, TypeError, ValueError, AttributeError, json.JSONDecodeError):
              pass
          print(f"healthy={'true' if fresh else 'false'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"healthy={'true' if fresh else 'false'}\n")
          PY
      - name: Run bot
        if: steps.fast_monitor.outputs.healthy != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          # Channel list lives in config/channels.json, not a secret.
          # Everything below is optional — the bot degrades gracefully
          # (skips that verification source) if a secret is unset.
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_APP_IG_USER_ID: ${{ secrets.INSTAGRAM_APP_IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m bot.main
      - name: Persist state
        run: |
          git config user.name "transfer-confirmation-bot"
          git config user.email "actions@github.com"
          git add data/transfers.json data/bot_updates.json data/news.json data/media_library.json data/identity_cards.json data/player_stats.json data/image_review.json data/fast_monitor.json config/channels.json config/settings.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update transfer state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
